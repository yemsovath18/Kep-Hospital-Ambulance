<!DOCTYPE html>
<html lang="km">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>របាយការណ៍ប្រចាំខែ — មន្ទីរពេទ្យខេត្តកែប</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0b3d78;
    --blue-700:#1a5aa8;
    --blue-500:#2d7dd2;
    --blue-100:#eaf3fd;
    --sky-100:#dbeeff;
    --red-600:#e0293e;
    --red-700:#c81f33;
    --green-600:#1a8f4c;
    --ink:#1c2a3a;
    --muted:#6b7c93;
    --card-bg:#ffffff;
    --field-bg:#f3f6fa;
    --border:#e1e8f0;
    --table-head:#1a5aa8;
    --table-alt:#dbeeff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Kantumruy Pro', sans-serif;
    background:
      radial-gradient(1200px 500px at 10% 0%, var(--sky-100), transparent 60%),
      radial-gradient(1000px 600px at 100% 20%, #cfe7ff, transparent 55%),
      linear-gradient(180deg, #f6fafe 0%, #eef5fc 100%);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:48px;
  }

  .banner{
    position:relative;
    overflow:hidden;
    background:linear-gradient(120deg, var(--blue-900) 0%, var(--blue-700) 55%, var(--blue-500) 100%);
    padding:22px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    color:#fff;
  }
  .banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 85% 120%, rgba(255,255,255,0.18), transparent 55%);
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:14px; z-index:1; }
  .logo-badge{
    width:56px;height:56px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .logo-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  .brand-text h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:.2px; }
  .brand-text p{ margin:2px 0 0; font-size:13px; font-weight:600; opacity:.92; }
  .nav-link{
    z-index:1;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    background:rgba(255,255,255,0.16);
    padding:9px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.35);
    white-space:nowrap;
    transition:background .15s;
  }
  .nav-link:hover{ background:rgba(255,255,255,0.28); }

  .wrap{ max-width:820px; margin:-6px auto 0; padding:0 18px; }
  .card{
    background:var(--card-bg);
    border-radius:22px;
    box-shadow:0 20px 50px -20px rgba(15,60,120,0.25);
    margin-top:26px;
    padding:34px 30px 30px;
  }
  .card-head{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .card-head .emoji{ font-size:28px; line-height:1; }
  .card-head h2{ margin:0; font-size:20px; font-weight:800; color:var(--red-600); letter-spacing:.2px; }
  .card-sub{ margin:6px 0 24px; font-size:13.5px; color:var(--muted); font-weight:500; }

  .control-row{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  .control-group label{
    display:block; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--ink);
  }
  input[type="month"]{
    background:var(--field-bg);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:11px 14px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
  }
  input[type="month"]:focus{
    outline:none; border-color:var(--blue-500); background:#fff;
    box-shadow:0 0 0 4px rgba(45,125,210,0.15);
  }
  .download-btn{
    background:linear-gradient(120deg, var(--blue-700), var(--blue-500));
    color:#fff;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 10px 20px -10px rgba(26,90,168,0.55);
    transition:filter .12s;
  }
  .download-btn:hover{ filter:brightness(1.05); }
  .download-btn:disabled{ opacity:.6; cursor:progress; }
  .download-btn svg{ width:17px; height:17px; }

  .total-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--blue-100);
    border-radius:14px;
    padding:16px 20px;
    margin-bottom:26px;
    font-weight:700;
  }
  .total-banner .num{ font-size:24px; color:var(--blue-700); font-weight:800; }

  .section{ margin-bottom:26px; }
  .section h3{
    font-size:15px;
    font-weight:800;
    color:var(--blue-900);
    margin:0 0 10px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    border-radius:10px;
    overflow:hidden;
    font-size:13.5px;
  }
  thead th{
    background:var(--table-head);
    color:#fff;
    text-align:left;
    padding:10px 14px;
    font-weight:700;
  }
  thead th.num-col{ text-align:right; }
  tbody td{
    padding:9px 14px;
    border-bottom:1px solid var(--border);
  }
  tbody td.num-col{ text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:nth-child(even){ background:#f7fafd; }
  tbody tr.total-row{
    background:var(--table-alt) !important;
    font-weight:800;
  }
  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:18px;
  }
  .status-msg{ text-align:center; font-size:13.5px; font-weight:600; margin-top:4px; min-height:18px; }
  .status-msg.ok{ color:var(--green-600); }
  .status-msg.err{ color:var(--red-700); }

  .tagline{
    text-align:center; margin-top:26px; padding-top:18px; border-top:1px solid var(--border);
    font-size:12.5px; color:var(--muted); letter-spacing:.3px; font-style:italic;
    max-width:820px; margin-left:auto; margin-right:auto;
  }

  @media (max-width:520px){
    .banner{ flex-direction:column; align-items:flex-start; }
    .card{ padding:24px 16px 20px; border-radius:18px; }
    table{ font-size:12.5px; }
    thead th, tbody td{ padding:8px 10px; }
  }
  @media print{
    body{ background:#fff !important; padding-bottom:0; }
    .banner{ background:#fff !important; color:var(--ink) !important; padding:0 0 14px; box-shadow:none; }
    .banner::after{ display:none; }
    .nav-link{ display:none; }
    .logo-badge{ box-shadow:none; }
    .brand-text h1, .brand-text p{ color:var(--ink); }
    .wrap{ max-width:100%; margin:0; padding:0; }
    .card{ box-shadow:none; border-radius:0; padding:0; margin-top:12px; }
    .control-row{ display:none; }
    .total-banner{ background:#fff; border:1.5px solid var(--border); }
    thead th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    tbody tr.total-row{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .section{ break-inside:avoid; }
    .status-msg{ display:none; }
  }
</style>
</head>

        <div class="control-group">

<script>
  // See index.html for why this is needed — relative links resolve against
  // the sandboxed googleusercontent.com iframe URL, not the real /exec URL.
  var DEPLOY_URL = 'https://script.google.com/macros/s/AKfycbxdG8M_KsH0J60Bq7qJ-wdcce6aqJzOTlznYuP3IMR8H8A73gFi0XtQdXtGFEZUwFjLYw/exec';
  document.getElementById('navLink').href = DEPLOY_URL;

  const SECTION_TITLES = {
    destinations: '១. សរុបតាមទិសដៅរថយន្ត',
    drivers: '២. សរុបតាមអ្នកបើកបរ',
    staff: '៣. សរុបតាមមន្ត្រី/បុគ្គលិកទទួលបន្ទុក',
    vehicles: '៤. សរុបតាមរថយន្ត'
  };
  const SECTION_ORDER = ['destinations', 'drivers', 'staff', 'vehicles'];

  function renderTable(sec) {
    if (!sec.rows.length) {
      return '<p class="empty-note">មិនទាន់មានទិន្នន័យសម្រាប់ខែនេះទេ</p>';
    }
    let html = '<table><thead><tr><th>ឈ្មោះ</th><th class="num-col">ចំនួនដងធ្វើដំណើរ</th></tr></thead><tbody>';
    sec.rows.forEach(r => {
      html += '<tr><td>' + escapeHtml(r.name) + '</td><td class="num-col">' + r.count + '</td></tr>';
    });
    html += '<tr class="total-row"><td>សរុប</td><td class="num-col">' + sec.total + '</td></tr>';
    html += '</tbody></table>';
    return html;
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderReport(data) {
    document.getElementById('totalTrips').textContent = data.totalTrips;
    let html = '';
    SECTION_ORDER.forEach(key => {
      html += '<div class="section"><h3>' + SECTION_TITLES[key] + '</h3>' + renderTable(data[key]) + '</div>';
    });
    document.getElementById('reportBody').innerHTML = html;
  }

  function loadReport() {
    const monthYear = document.getElementById('monthPicker').value;
    if (!monthYear) return;
    document.getElementById('reportBody').innerHTML = '<p class="empty-note">កំពុងផ្ទុកទិន្នន័យ...</p>';
    document.getElementById('totalTrips').textContent = '–';
    google.script.run
      .withSuccessHandler(renderReport)
      .withFailureHandler(function(err){
        document.getElementById('reportBody').innerHTML =
          '<p class="empty-note">មិនអាចផ្ទុករបាយការណ៍បានទេ៖ ' + escapeHtml(err.message) + '</p>';
      })
      .getReportData(monthYear);
  }

  document.getElementById('monthPicker').addEventListener('change', loadReport);

  const printBtn = document.getElementById('printBtn');
  printBtn.addEventListener('click', function(){
    window.print();
  });

  // Default to the current month on load.
  (function initMonth(){
    const now = new Date();
    const val = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('monthPicker').value = val;
    loadReport();
  })();
</script>
